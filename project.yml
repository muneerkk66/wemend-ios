name: WeMendAI
options:
  bundleIdPrefix: com.wemendai
  deploymentTarget:
    iOS: "17.0"
targets:
  WeMendAI:
    type: application
    platform: iOS
    sources: [WeMendAI]
    info:
      path: WeMendAI/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wemendai.testapp
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
