name: WeMendAI
options:
  bundleIdPrefix: com.necsca
  deploymentTarget:
    iOS: "17.0"
targets:
  WeMendAI:
    type: application
    platform: iOS
    sources: [WeMendAI]
    info:
      # NOTE: xcodegen GENERATES this file from the properties below and will
      # overwrite anything hand-written at that path. Declaring the keys here is
      # the only thing that survives `xcodegen generate`. A missing
      # NSMicrophoneUsageDescription makes iOS hard-kill the app the instant it
      # touches the mic — which looks like a crash "after recording".
      path: WeMendAI/Info.plist
      properties:
        CFBundleDisplayName: WeMendAI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          WeMendAI needs your microphone so you can speak with the mediator.
        # Dev only: allows a plain-HTTP backend (SSH tunnel / LAN IP). The RunPod
        # proxy is HTTPS and does not need this. Remove before shipping.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: WeMendAI/WeMendAI.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        DEVELOPMENT_TEAM: Y89LU2A58Y
        PRODUCT_BUNDLE_IDENTIFIER: com.necsca.wemendai
        MARKETING_VERSION: "0.1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
